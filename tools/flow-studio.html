<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Studio — Power Automate action generator</title>
<!--
  Flow Studio, standalone.

  Same screen and same generator as the DGO route at #/flow-studio, with no platform behind
  it. Open over HTTP (ES modules do not load from file://):

      npx http-server .        then browse to /tools/flow-studio.html

  For a file you can just double-click, build the single-file package instead:

      node tools/build-standalone.mjs   ->  dist/flow-studio.html

  The screen and its stylesheet both live in core/power-automate/, so the two surfaces
  cannot drift. What this file supplies is only what the DGO shell would otherwise: the
  colour tokens, a toast, a confirm dialog, view state and storage.
-->
<style>
  /* The tokens core/power-automate/studio.css.js reads. The platform defines these same
     names in its design system, which is why one stylesheet serves both surfaces and
     follows each one's themes. */
  :root{
    --bg:#f4f7f5; --s:#ffffff; --sunken:#eef2ef;
    --fg:#25302b; --strong:#0d1f18; --mut:#66736c; --bd:#dde7e1;
    --p:#05583B; --a:#17B255;
    --danger:#a5122c; --warn:#8a6100; --info:#054871;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1512; --s:#151d19; --sunken:#111813;
      --fg:#dfe8e3; --strong:#f2f7f4; --mut:#93a49b; --bd:#26332c;
      --p:#0c7f4f; --a:#3ddb7c;
      --danger:#ff8095; --warn:#e0b45c; --info:#7fc4ef;
    }
  }

  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
  #app{height:100%}

  /* Feedback surfaces the shell would normally own. */
  #toasts{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;flex-direction:column;gap:6px}
  .toast{
    background:var(--strong);color:var(--bg);padding:9px 13px;border-radius:6px;
    font-size:11.5px;max-width:44ch;box-shadow:0 8px 24px #0004;
  }
  .toast.success{background:var(--p);color:#fff}
  .toast.error{background:var(--danger);color:#fff}
  @media (prefers-color-scheme:dark){.toast.success,.toast.error{color:#08130d}}

  dialog{
    border:1px solid var(--bd);border-radius:10px;background:var(--s);color:var(--fg);
    padding:16px;max-width:34rem;width:calc(100% - 32px);font:13px/1.5 var(--sans);
  }
  dialog::backdrop{background:#0b1a1499}
  dialog h2{margin:0 0 8px;font-size:16px;color:var(--strong)}
  dialog p{margin:0 0 8px}
  .dlg-row{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
  .dlg-btn{
    border:1px solid var(--bd);background:var(--s);color:var(--fg);
    border-radius:5px;padding:6px 12px;font:700 11.5px var(--sans);cursor:pointer;
  }
  .dlg-btn--go{background:var(--p);border-color:var(--p);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module">
  import { createStudio } from '../core/power-automate/studio.js';

  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

  const emptyState = (title, body) =>
    `<div style="text-align:center;padding:28px 12px;color:var(--mut)">
       <p style="margin:0 0 4px;font-weight:700;color:var(--fg)">${esc(title)}</p>
       <p style="margin:0;font-size:11.5px">${esc(body)}</p>
     </div>`;

  function toast(message, tone = '') {
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.textContent = message;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 5200);
  }

  // A promise-returning confirm matching the platform's confirmAction() contract. `body` is
  // trusted markup from the studio itself, never from a plan.
  function confirmDialog(options) {
    const o = typeof options === 'string' ? { title: 'Confirm', body: options } : (options || {});
    return new Promise(resolve => {
      const dlg = document.createElement('dialog');
      dlg.innerHTML = `<h2>${esc(o.title || 'Confirm')}</h2><div>${o.body || ''}</div>
        <div class="dlg-row">
          <button type="button" class="dlg-btn" data-no>${esc(o.cancelText || 'Cancel')}</button>
          <button type="button" class="dlg-btn dlg-btn--go" data-yes>${esc(o.confirmText || 'Continue')}</button>
        </div>`;
      const done = value => { dlg.close(); dlg.remove(); resolve(value); };
      dlg.querySelector('[data-yes]').onclick = () => done(true);
      dlg.querySelector('[data-no]').onclick = () => done(false);
      dlg.addEventListener('cancel', e => { e.preventDefault(); done(false); });
      document.body.appendChild(dlg);
      dlg.showModal();
    });
  }

  // View state: selection, collapsed branches, palette query. In memory, as UIState is.
  let view = {};
  const getState = (defaults = {}) => ({ ...defaults, ...view });
  const setState = patch => { view = { ...view, ...patch }; };

  createStudio({
    esc, emptyState,
    toast,
    confirm: confirmDialog,
    getState, setState,
    storage: {
      // A different key from the platform's, so the two surfaces keep separate drafts on the
      // same origin rather than silently overwriting each other's work.
      get: key => localStorage.getItem(`standalone:${key}`),
      set: (key, value) => localStorage.setItem(`standalone:${key}`, value)
    }
  }).mount(document.getElementById('app'));
</script>
</body>
</html>
